name: ask-the-trail

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on the host to avoid clashing with a local Postgres, if one is ever installed
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: "1000"
        GID: "1000"
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Allows reaching the server from the host
      RAILS_DEVELOPMENT_HOSTS: localhost,127.0.0.1
    volumes:
      - .:/app
      - bundle:/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  pgdata:
  bundle:
