# PostgreSQL. In development/test the database runs in the `db` container
# from compose.yaml; credentials come from environment variables.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: ask_the_trail_development

# Warning: the "test" database is erased and recreated when you run the test suite.
test:
  <<: *default
  database: ask_the_trail_test

# Em producao, prefira DATABASE_URL ou credenciais criptografadas
# (config/credentials.yml.enc) a variaveis em texto plano.
production:
  <<: *default
  database: ask_the_trail_production
